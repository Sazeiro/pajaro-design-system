<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Badge — preview</title></head>
<body>
<div id="root" class="pj-stage pj-row"></div>
<script>
var P = window.Pajaro, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(P.Badge, { tone: 'sol' }, 'Mejor opción'),
  h(P.Badge, { tone: 'cielo' }, 'Sugerido'),
  h(P.Badge, { tone: 'success', icon: 'arrowDown' }, '−14%'),
  h(P.Badge, { tone: 'danger', icon: 'arrowUp' }, '+9%'),
  h(P.Badge, { tone: 'warning', icon: 'clock' }, 'Esperá'),
  h(P.Badge, null, '1 escala')
));
</script>
</body>
</html>
