<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div id="root" class="pj-stage" style="flex-direction:column;gap:16px"></div>
<script>
var P = window.Pajaro, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h('div', { className: 'pj-row' },
    h(P.Button, { variant: 'primary', iconEnd: 'arrowRight' }, 'Buscar vuelos'),
    h(P.Button, { variant: 'secondary', icon: 'bell' }, 'Crear alerta'),
    h(P.Button, { variant: 'ghost' }, 'Ver fechas flexibles'),
    h(P.Button, { variant: 'primary', disabled: true }, 'Sin resultados')),
  h('div', { className: 'pj-row' },
    h(P.Button, { variant: 'primary', size: 'sm' }, 'Elegir vuelo'),
    h(P.Button, { variant: 'secondary', size: 'sm' }, 'Comparar'),
    h(P.Button, { variant: 'ghost', size: 'sm' }, 'Ver detalle'))
));
</script>
</body>
</html>
